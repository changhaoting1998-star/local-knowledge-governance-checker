[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-knowledge-governance-checker"
version = "0.1.0"
description = "Privacy-preserving, read-only governance checks for local Markdown knowledge bases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "changhaoting1998-star" }]
keywords = ["markdown", "obsidian", "knowledge-base", "privacy", "governance", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
kgov = "kgov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

